name: Build KPM Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源代码
        uses: actions/checkout@v4

      - name: 获取 KernelPatch 源码
        run: |
          git clone --depth 1 --single-branch \
            --branch 0.11.3 \
            https://github.com/bmax121/KernelPatch.git \
            ../KernelPatch-0.11.3

      - name: 获取 OnePlus Kernel 源码
        run: |
          git clone --depth 1 --single-branch \
            --branch oneplus/sm8450_b_16.0_oneplus_10_pro \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8450.git \
            ../android_kernel_modules_and_devicetree_oneplus_sm8450-oneplus-sm8450_b_16.0_oneplus_10_pro

      - name: 检查 Camera Kernel 头文件
        run: |
          test -f ../android_kernel_modules_and_devicetree_oneplus_sm8450-oneplus-sm8450_b_16.0_oneplus_10_pro/vendor/qcom/opensource/camera-kernel/include/uapi/camera/media/cam_defs.h
          test -f ../android_kernel_modules_and_devicetree_oneplus_sm8450-oneplus-sm8450_b_16.0_oneplus_10_pro/vendor/qcom/opensource/camera-kernel/drivers/cam_core/cam_hw_mgr_intf.h
          echo "Camera kernel headers found."

      - name: 配置 Android NDK 环境
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: 编译 KPM
        run: |
          export NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          make NDK_PATH="$NDK_PATH"

      - name: 诊断 ELF relocation
        if: always()
        run: |
          export NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          export LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "===== pwd ====="
          pwd

          echo "===== files ====="
          find . -maxdepth 3 -type f \
            \( -name "*.o" -o -name "*.kpm" \) \
            -print

          echo "===== hello.o relocation ====="
          if [ -f hello.o ]; then
            "$LLVM_BIN/llvm-readelf" -r hello.o || true
          fi

          echo "===== all object relocations ====="
          find . -type f -name "*.o" -print0 |
          while IFS= read -r -d '' obj; do
            echo
            echo "===== $obj ====="
            "$LLVM_BIN/llvm-readelf" -r "$obj" || true
          done

          echo "===== symbols ====="
          if [ -f hello.o ]; then
            "$LLVM_BIN/llvm-readelf" -s hello.o || true
          fi

      - name: 打包并上传成品
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Output
          path: |
            ./*.kpm
            out/*.kpm
            build/*.kpm
            hello.o
